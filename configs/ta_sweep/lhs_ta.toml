# LHS study of the prescribed-Ta parameters (scripts/sample_ta_lhs.py).
base = "base.toml"            # relative to this file
study = "ta_lhs"              # output in runs/<study>/
n_samples = 128
seed = 20261020

# Ta_d is swept, so the preload differs between samples: each sample runs from t = 0

# Multiplicative factors on the [active.endo] values in base.toml; epi and mid follow
# through their fixed ratios. Uniform LHS between [low, high].
[factors]
Ta_peak_kpa = [5.0, 10.0]     # 27 kPa endo -> 135 to 270 kPa (mid 2.39x that)
t_peak_ms = [0.8, 1.2]        # 167 ms -> 134 to 201 ms
a_rise = [0.6, 1.6]           # 0.99 -> 0.59 to 1.59 (front-loaded to slow onset)
sigma_decay_ms = [0.8, 1.2]   # 96 ms -> 77 to 115 ms

# Absolute values, by dotted config path. Ta_d_frac sets diastolic Ta in each cell type as a
# fraction of that cell type's Ta_peak (the ToRORd-Land fit gives 0.0013 to 0.0028).
[values]
"active.Ta_d_frac" = [0.0, 0.01]

[override]
"time.t_end_ms" = 800.0